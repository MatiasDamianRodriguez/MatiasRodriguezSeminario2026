# Publica solo la carpeta TP_final/app/frontend en GitHub Pages cada vez que cambia en main.
name: Publicar frontend en GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "TP_final/app/frontend/**"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: TP_final/app/frontend
      - id: deployment
        uses: actions/deploy-pages@v40